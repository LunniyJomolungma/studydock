name: Java build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - if: runner.os == 'Linux'
        run: sh build.sh test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 -Test
